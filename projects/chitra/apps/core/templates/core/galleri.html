{% extends 'core/base.html' %}
{% load static %}
{% load cache_bust %}

{% block head %}
<title>Galleri | Chitra house</title>
<meta name="description" content="Et innblikk i Chitra house – galleri med bilder av fasaden, interiøret og detaljene som gir huset sin egen karakter.">
<meta name="author" content="Chitra">
{% endblock %}

{% block content %}

<link rel="stylesheet" href="{% static_versioned 'scss/pages/pages.css' %}" type="text/css">
<script src="{% static_versioned 'js/galleri.js' %}" defer></script>

<section class="video-hero" data-nav-theme="dark">
    <img class="video-hero-media" src="{% static 'images/Galleri/Fasade_37.webp' %}" alt="Fasaden på Chitra house med tårn og forgylt Chitra-logo, omkranset av grønne trær" fetchpriority="high" decoding="async">
    <div class="video-hero-overlay"></div>
    <div class="video-hero-content">
        <h1>Galleri</h1>
        <img class="hero-divider" src="{% static 'images/Guilloche.png' %}" alt="" loading="lazy" decoding="async">
        <p>Et innblikk i Chitra House</p>
    </div>
</section>

<section class="gallery" data-nav-theme="dark">
    <div class="gallery-grid">
        {% for image in gallery_images %}
        <figure class="gallery-item">
            <img src="{% static image.src %}" alt="{{ image.alt }}"
                 {% if forloop.counter <= 6 %}decoding="async"{% else %}loading="lazy" decoding="async"{% endif %}>
        </figure>
        {% endfor %}
    </div>
</section>

{% endblock %}
