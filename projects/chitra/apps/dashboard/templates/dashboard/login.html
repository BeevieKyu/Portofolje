<!doctype html>
{% load static %}
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Logg inn | Kontrollpanel | Chitra</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'scss/dashboard/dashboard.css' %}" type="text/css">
</head>
<body class="dash dash-login-body">

    <div class="dash-login-shell">
        <div class="dash-login-card">
            <span class="wordmark dash-login-logo">Chitra</span>
            <h1>Kontrollpanel</h1>
            <p class="dash-login-sub">Logg inn for å administrere nettsiden.</p>

            {% if error %}
            <div class="dash-flash dash-flash-error"><i class="fa-light fa-triangle-exclamation"></i><span>{{ error }}</span></div>
            {% endif %}

            <form method="post" class="dash-login-form" novalidate>
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="dash-field">
                    <label for="id_username">Brukernavn</label>
                    <input type="text" id="id_username" name="username" class="dash-input" autocomplete="username" autofocus required>
                </div>
                <div class="dash-field">
                    <label for="id_password">Passord</label>
                    <input type="password" id="id_password" name="password" class="dash-input" autocomplete="current-password" required>
                </div>
                <button type="submit" class="dash-button dash-button-primary dash-button-block">Logg inn</button>
            </form>

            <a href="/" class="dash-login-back"><i class="fa-light fa-arrow-left"></i>Tilbake til nettsiden</a>
        </div>
    </div>

</body>
</html>
