<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This page could not be found on Marie Klausen's portfolio.">
    <title>404 // Page not found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">
    <script src="scripts/cursor.js" defer></script>
</head>
<body>
    <div class="custom-cursor" aria-hidden="true"></div>
    <div class="site-shell">
        <header class="site-header">
            <a class="logo" href="index.html" aria-label="MK home"><span>MK</span><i>_</i></a>
            <a class="status-pill" href="index.html#contact"><span></span> available for work</a>
        </header>

        <main class="error-page" aria-labelledby="error-title">
            <div class="error-copy">
                <p class="eyebrow"><span>404</span> signal lost</p>
                <h1 id="error-title">This page wandered<br><em>off the internet.</em></h1>
                <p class="error-message">The requested route does not exist. The good news is that I do.</p>
                <div class="error-actions">
                    <a class="button button-primary" href="index.html">go home <span>-&gt;</span></a>
                    <a class="text-link" href="index.html#work">see my work <span>-&gt;</span></a>
                </div>
            </div>
            <div class="error-terminal" aria-label="404 error details">
                <div class="console-top"><span>~/portfolio</span><span class="console-dots">_ [] x</span></div>
                <div class="error-terminal-body">
                    <p><span class="prompt">$</span> locate page</p>
                    <p class="console-output">page not found</p>
                    <p><span class="prompt">$</span> suggest_next_step</p>
                    <p class="console-output">hire me :)</p>
                </div>
                <img class="error-sprite" src="Images/MkSprite-transparent.png" alt="MK sprite">
            </div>
        </main>

        <footer class="site-footer"><span>MK // 404</span><span>built with love</span><a href="index.html">back to home ^</a></footer>
    </div>
</body>
</html>
